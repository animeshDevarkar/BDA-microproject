# Publishes the website/ folder to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy-website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the data files exist
        run: |
          missing=0
          for f in site-data-usa site-data-india price-data-usa price-data-india cost-data-usa cost-data-india; do
            if [ ! -s "website/data/$f.js" ]; then
              echo "::error::Missing website/data/$f.js - run the pipeline locally and commit it"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
