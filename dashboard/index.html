<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Delay Analysis</title>
<meta name="description" content="Flight delay patterns and airport network bottlenecks for International (USA, BTS) and Domestic (India) flights, processed with PySpark.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232a78d6' d='M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --axis-text: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --series-1: #2a78d6;
  --series-1-wash: rgba(42, 120, 214, 0.10);
  --series-2: #eb6834;
  --series-1-hover: #1c5cab;
  --critical: #d03b3b;
  --warning-bg: #fff4dc;
  --warning-ink: #6b4a00;
  --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 8px 24px rgba(11, 11, 11, 0.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9c9a93;
    --axis-text: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5;
    --series-1-wash: rgba(57, 135, 229, 0.14);
    --series-2: #d95926;
    --series-1-hover: #6da7ec;
    --critical: #e66767;
    --warning-bg: #3a2e12;
    --warning-ink: #f5d690;
    --focus: #6da7ec;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232321;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #9c9a93;
  --axis-text: #898781;
  --grid: #2c2c2a;
  --baseline: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --series-1: #3987e5;
  --series-1-wash: rgba(57, 135, 229, 0.14);
  --series-2: #d95926;
  --series-1-hover: #6da7ec;
  --critical: #e66767;
  --warning-bg: #3a2e12;
  --warning-ink: #f5d690;
  --focus: #6da7ec;
  --shadow: none;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--series-1); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* Header */
header.top { padding: 40px 0 8px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin: 0 0 6px; }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
.lede { color: var(--ink-2); margin: 10px 0 0; max-width: 68ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 16px; font-size: 13px; color: var(--muted); }
.meta-row span { display: inline-flex; gap: 6px; align-items: center; }
.meta-row b { color: var(--ink-2); font-weight: 600; }
.banner {
  margin-top: 16px; padding: 10px 14px; border-radius: 10px;
  background: var(--warning-bg); color: var(--warning-ink); font-size: 14px;
  display: flex; gap: 10px; align-items: flex-start;
}
.banner svg { flex: none; margin-top: 2px; }
.dataset-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.dataset-switch .seg button { font-size: 14px; }

/* Nav */
nav.sections {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
  margin-top: 24px;
}
nav.sections .wrap { display: flex; align-items: center; gap: 4px; height: 52px; }
.nav-links { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-links a {
  color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 500;
  padding: 6px 12px; border-radius: 8px; white-space: nowrap;
}
.nav-links a:hover { background: var(--surface-2); color: var(--ink); }
.nav-links a.active { color: var(--ink); background: var(--surface-2); }
.icon-btn {
  flex: none; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2);
}
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }

/* Sections */
section.block { padding: 40px 0 8px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h2 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.section-sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; max-width: 70ch; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 900px) { .grid.two { grid-template-columns: minmax(0, 1fr); } }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 20px; box-shadow: var(--shadow); min-width: 0;
}
.card-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card h3 { font-size: 15px; margin: 0; font-weight: 600; }
.card .sub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Segmented control */
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--border); }
.seg button {
  border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; cursor: pointer;
  font-size: 13px; color: var(--ink-2); white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--border); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }

input[type="search"], select {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; height: 32px;
}
input[type="search"] { width: 260px; max-width: 100%; }

/* KPI */
.kpis { display: grid; grid-template-columns: 1.3fr repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
.hero { grid-row: span 2; display: flex; flex-direction: column; justify-content: space-between; }
@media (max-width: 1000px) { .hero { grid-row: auto; grid-column: 1 / -1; } }
.tile-label { font-size: 13px; color: var(--ink-2); margin: 0; }
.hero-value { font-size: clamp(48px, 7vw, 64px); font-weight: 650; letter-spacing: -0.03em; line-height: 1; margin: 12px 0 8px; }
.hero-value small { font-size: .45em; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.tile-value { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 2px; line-height: 1.1; }
.tile-note { font-size: 13px; color: var(--muted); margin: 0; }
.meter { height: 8px; border-radius: 4px; background: var(--series-1-wash); overflow: hidden; margin-top: 16px; }
.meter > i { display: block; height: 100%; background: var(--series-1); border-radius: 4px; }

.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.findings li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); }
.findings li:first-child { border-top: 0; padding-top: 0; }
.findings .q { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 2px; }
.findings p { margin: 0; color: var(--ink-2); }
.findings strong { color: var(--ink); font-weight: 600; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-size: 12px; fill: var(--axis-text); font-variant-numeric: tabular-nums; }
.chart text.label { fill: var(--ink-2); }
.chart text.label-strong { fill: var(--ink); font-weight: 600; }
.chart text.value { fill: var(--ink-2); font-weight: 600; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .baseline { stroke: var(--baseline); stroke-width: 1; shape-rendering: crispEdges; }
.chart .ref { stroke: var(--ink-2); stroke-width: 1; opacity: .55; }
.chart text.halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.chart .mark { fill: var(--series-1); transition: fill .12s; }
.chart .mark.alt { fill: var(--series-2); }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .mark, .chart .row:hover .mark, .chart .row:focus .mark { fill: var(--series-1-hover); }
.chart .row:focus { outline: none; }
.chart .row:focus .hit { stroke: var(--focus); stroke-width: 2; }
.chart .line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--series-1-wash); }
.chart .dot { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
.chart .crosshair { stroke: var(--baseline); stroke-width: 1; }
.chart .scatter-dot { fill: var(--series-1); fill-opacity: .45; }
.chart .scatter-dot.alt { fill: var(--series-2); fill-opacity: 1; stroke: var(--surface); stroke-width: 2; }
.chart .scatter-dot.hover { fill-opacity: 1; stroke: var(--ink); stroke-width: 1.5; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend i.line { width: 14px; height: 0; border-radius: 0; border-top: 1px solid var(--ink-2); opacity: .7; }

.tooltip {
  position: fixed; z-index: 50; pointer-events: none; min-width: 140px; max-width: 260px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .14); padding: 10px 12px; font-size: 13px;
  opacity: 0; transform: translateY(4px); transition: opacity .1s, transform .1s;
}
.tooltip.show { opacity: 1; transform: none; }
.tooltip .tt-title { font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); }
.tooltip .tt-row b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; max-height: 480px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
th { position: sticky; top: 0; background: var(--surface-2); color: var(--ink-2); font-weight: 600; z-index: 1; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th .arrow { opacity: .6; margin-left: 4px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
.cell-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--series-1); vertical-align: middle; margin-left: 8px; opacity: .8; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 14px; border: 1px dashed var(--border); border-radius: 10px; }

.method dl { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 10px 20px; margin: 0; }
@media (max-width: 640px) { .method dl { grid-template-columns: 1fr; gap: 2px; } .method dd { margin-bottom: 10px; } }
.method dt { font-weight: 600; font-size: 14px; }
.method dd { margin: 0; color: var(--ink-2); font-size: 14px; }
code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
footer { padding: 32px 0 48px; color: var(--muted); font-size: 13px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.error-box { margin: 80px auto; max-width: 560px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

<script src="data-usa.js"></script>
<script src="data-india.js"></script>
<script>
"use strict";
(function () {
  const app = document.getElementById("app");
  /* ---------- Dataset: International (USA) or Domestic (India) ---------- */
  const SETS = window.DASHBOARD_DATASETS || {};
  const DATASET_ORDER = ["usa", "india"].filter(k => SETS[k]);
  const DATASET_KEY = "flight-dashboard-dataset";
  const datasetKey = (() => {
    try { const q = new URLSearchParams(location.search).get("dataset"); if (q && SETS[q]) return q; } catch (e) { /* no query */ }
    try { const v = localStorage.getItem(DATASET_KEY); if (v && SETS[v]) return v; } catch (e) { /* storage blocked */ }
    return DATASET_ORDER[0];
  })();
  const D = SETS[datasetKey];

  if (!D) {
    app.innerHTML = '<div class="wrap"><div class="card error-box"><h2>No data yet</h2>' +
      '<p class="section-sub">Run the pipeline first, then reload this page:</p>' +
      '<p><code>python src\\flight_delay_pipeline.py</code></p>' +
      '<p class="section-sub">It writes <code>dashboard/data-usa.js</code> (and <code>data-india.js</code> with <code>--dataset india</code>) next to this file.</p></div></div>';
    return;
  }

  /* ---------- Theme ---------- */
  const THEME_KEY = "flight-dashboard-theme";
  function storedTheme() { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } }
  function applyTheme(theme) {
    if (theme) document.documentElement.setAttribute("data-theme", theme);
    else document.documentElement.removeAttribute("data-theme");
  }
  if (storedTheme()) applyTheme(storedTheme());
  function isDark() {
    const t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  /* ---------- Formatting ---------- */
  const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmt = {
    int: v => v == null ? "–" : nf0.format(v),
    pct: v => v == null ? "–" : nf1.format(v) + "%",
    min: v => v == null ? "–" : nf1.format(v) + " min",
    num1: v => v == null ? "–" : nf1.format(v),
    compact(v) {
      if (v == null) return "–";
      const a = Math.abs(v);
      if (a >= 1e9) return trimZero((v / 1e9).toFixed(1)) + "B";
      if (a >= 1e6) return trimZero((v / 1e6).toFixed(1)) + "M";
      if (a >= 1e3) return trimZero((v / 1e3).toFixed(a >= 1e4 ? 0 : 1)) + "K";
      return nf0.format(v);
    },
  };
  function trimZero(s) { return s.replace(/\.0$/, ""); }
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function monthLabel(ym, withYear) {
    const [y, m] = String(ym).split("-");
    return MONTHS[+m - 1] + (withYear ? " " + y : "");
  }
  function hourLabel(h) { return String(h).padStart(2, "0") + ":00"; }
  function ymd(n) {
    if (!n) return null;
    const s = String(Math.round(n));
    return new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
  }
  function niceDate(d) { return d ? d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "–"; }

  /* ---------- DOM helpers ---------- */
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) if (c != null) node.append(c.nodeType ? c : document.createTextNode(String(c)));
    return node;
  }
  const SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs, text) {
    const node = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) node.setAttribute(k, v);
    if (text != null) node.textContent = text;
    return node;
  }
  function icon(path, size) {
    const svg = s("svg", { width: size || 16, height: size || 16, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
    svg.innerHTML = path;
    return svg;
  }
  const ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  };

  /* ---------- Tooltip ---------- */
  const tip = document.getElementById("tooltip");
  function showTip(evt, title, rows) {
    tip.replaceChildren(el("div", { class: "tt-title", text: title }),
      ...rows.map(([k, v]) => el("div", { class: "tt-row" }, el("span", { text: k }), el("b", { text: v }))));
    tip.classList.add("show");
    moveTip(evt);
  }
  function moveTip(evt) {
    let x, y;
    if (evt && evt.clientX != null && evt.type !== "focus") { x = evt.clientX; y = evt.clientY; }
    else if (evt && evt.target && evt.target.getBoundingClientRect) {
      const r = evt.target.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top;
    } else return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let left = x + 14, top = y - h - 12;
    if (left + w > window.innerWidth - 8) left = x - w - 14;
    if (left < 8) left = 8;
    if (top < 8) top = y + 18;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  function hideTip() { tip.classList.remove("show"); }
  window.addEventListener("scroll", hideTip, { passive: true });

  /* ---------- Scales ---------- */
  function niceStep(v) {
    const exp = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / exp;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * exp;
  }
  // Axis from 0 to the first clean tick at or above the data maximum.
  function niceScale(dataMax, count) {
    if (!(dataMax > 0)) return { max: 1, ticks: [0, 1] };
    const step = niceStep(dataMax / (count || 4));
    const max = Math.ceil(dataMax / step - 1e-9) * step;
    const out = [];
    for (let t = 0; t <= max + 1e-9; t += step) out.push(+t.toFixed(10));
    return { max, ticks: out };
  }
  function measureText(text) {
    measureText.ctx = measureText.ctx || document.createElement("canvas").getContext("2d");
    measureText.ctx.font = "12px system-ui, -apple-system, Segoe UI, sans-serif";
    return measureText.ctx.measureText(text).width;
  }
  // Bar path with 4px rounded data-end, square at the baseline.
  function hBarPath(x0, y, w, h, r) {
    r = Math.min(r, w, h / 2);
    if (w <= 0) return "";
    return `M${x0},${y}H${x0 + w - r}Q${x0 + w},${y} ${x0 + w},${y + r}V${y + h - r}Q${x0 + w},${y + h} ${x0 + w - r},${y + h}H${x0}Z`;
  }
  function vBarPath(x, y0, w, h, r) {
    r = Math.min(r, h, w / 2);
    if (h <= 0) return "";

      el("dt", { text: "Arrival delay rate" }), el("dd", { text: "Delayed operated flights ÷ operated flights with a known arrival delay × 100. Cancelled and diverted flights are excluded from both and reported separately." }),
      el("dt", { text: "Departure delay rate" }), el("dd", { text: "Used for origin airports: non-cancelled flights departing 15+ minutes late ÷ non-cancelled flights with a known departure delay." }),
      el("dt", { text: "Minimum volume" }), el("dd", { text: `Rankings include only groups with enough flights (${meta.min_flights || "airline/airport 100, route 50"}) to avoid unstable rates from tiny samples.` }),
      el("dt", { text: "Priority score" }), el("dd", { text: "Delay rate (%) × ln(1 + flights). A project-defined score balancing rate and volume; compare it with delay rate alone." }),
      el("dt", { text: "Pipeline" }), el("dd", {}, "PySpark (local mode) reads the raw CSV, normalises column names, casts types, drops invalid and duplicate records, derives features, writes Parquet partitioned by month, and aggregates the summary CSVs in ", el("code", { text: datasetKey === "usa" ? "output/powerbi/" : `output/${datasetKey}/powerbi/` }), " (also used for Power BI)."),
      el("dt", { text: "Limitations" }), el("dd", { text: meta.simulated ? "Simulated flight records calibrated to published DGCA on-time levels; patterns are realistic but individual numbers are not real observations. Descriptive only — no prediction." : "U.S. reporting carriers only; historical and descriptive — no prediction. Delay causes can be blank. High delay metrics flag a hotspot for investigation; they do not prove the airport or airline caused the delay." }))),
    ));

  const footer = el("footer", {}, el("div", { class: "wrap", text: `Generated ${meta.generated_at || ""} from ${datasetKey === "usa" ? "output/powerbi" : `output/${datasetKey}/powerbi`} summary CSVs.` }));

  app.append(header, nav, el("main", {}, overview, timeSection, airlineSection, airportSection, routeSection, causeSection, methodSection), footer);
  routeTable(routeTopHost);

  /* ---------- Render + resize ---------- */
  function drawAll() { renderers.forEach(r => r.redraw()); }
  drawAll();
  let lastWidth = window.innerWidth, raf = 0;
  window.addEventListener("resize", () => {
    if (window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(drawAll);
  });

  /* ---------- Active section in nav ---------- */
  const sectionEls = NAV.map(([id]) => document.getElementById(id));
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      navLinks.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  sectionEls.forEach(sec => sec && observer.observe(sec));
})();
</script>
</body>
</html>
